; One environment per physical node, so the firmware always matches the hardware
; it is flashed to and the sensor profile can never be mismatched by hand.
;
;   pio run -e node1_env_safety -t upload   ; Node 1 - MQ-135 + DHT11 + buzzer
;   pio run -e node2_kitchen    -t upload   ; Node 2 - DHT11 + PIR + sound
;   pio run -e legacy_imu       -t upload   ; MPU-6050 bench rig
;
; Bare `pio run` builds every environment, which is the verification gate.

[platformio]
default_envs = node1_env_safety, node2_kitchen, legacy_imu

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Larger partition scheme needed when INFERENCE_MODE=1 (TFLite model in flash)
board_build.partitions = huge_app.csv
upload_speed = 921600

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0

; -- Node 1: Environment Safety ----------------------------------------------
[env:node1_env_safety]
build_flags =
    ${env.build_flags}
    -DSENSOR_PROFILE=1
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; -- Node 2: Kitchen / Occupancy ----------------------------------------------
[env:node2_kitchen]
build_flags =
    ${env.build_flags}
    -DSENSOR_PROFILE=2
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; -- MPU-6050 bench rig -------------------------------------------------------
; Not deployed, kept buildable so the original pipeline never silently rots.
[env:legacy_imu]
build_flags =
    ${env.build_flags}
    -DSENSOR_PROFILE=0
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.14.5
    ; Uncomment after running ml/convert_tflite.py and setting INFERENCE_MODE=1:
    ; spaziochirale/Chirale_TensorFLowLite@^2.0.0
